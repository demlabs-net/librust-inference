[package]
name = "rust-inference"
description = "Shared inference infrastructure: NN primitives, the Metal engine, sampling, weights"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
safetensors = "0.4"
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

# The Metal engine (our own MSL kernels + buffers) lives on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"
objc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
metal = "0.31"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
