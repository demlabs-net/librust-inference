[package]
name = "rust-inference"
description = "Shared inference infrastructure: NN primitives, the Metal engine, sampling, weights"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
safetensors = "0.4"
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
cudarc = { version = "0.19.9", default-features = false, optional = true }
half = "2"
memmap2 = "0.9"
rustfft = "6"
# R: 0.8 → 0.9 (the old pin kept a legacy rand chain in the tree).
rand = "0.9"

# Backend selection is explicit per build (no silent CPU fallback — GPU-only
# rule). `metal` (macOS) is implemented; `cuda` lands with the CudaBackend
# (Phase 3); `vulkan`, `wasm-webgpu` with their engines. `cpu` is the
# test-only reference backend (small models, explicit runtime opt-in).
[features]
# K30: `cpu` is default so plain `cargo test` runs the CPU-reference
# integration tests (gemm/ops/parity) — with default=[] a bare `cargo test`
# compiled ZERO integration tests and the CPU oracles silently rotted.
# The runtime backend selection is still explicit (no silent CPU fallback);
# this only compiles the reference backend in.
default = ["cpu"]
metal = ["dep:metal", "dep:objc"]
cuda = ["dep:cudarc", "cudarc/std", "cudarc/driver", "cudarc/nvrtc", "cudarc/dynamic-loading", "cudarc/cuda-13030", "cudarc/cublas", "cudarc/f16"]
vulkan = []
wasm-webgpu = []
cpu = []

# K30: the LLM demo examples need a real backend (metal/cuda) — with
# `cpu` now in default, plain `cargo test` must not try to build them
# (they are LLM-zone demos, not part of the bridge's test surface).
[[example]]
name = "audio_chat"
required-features = ["metal"]
[[example]]
name = "llm_chat"
required-features = ["metal"]
[[example]]
name = "qwen35_chat"
required-features = ["metal"]
[[example]]
name = "mv_bench"
required-features = ["metal"]
[[example]]
name = "prefill_probe"
required-features = ["metal"]
[[example]]
name = "llm_bench"
required-features = ["metal"]
[[example]]
name = "decode_breakdown"
required-features = ["metal"]
[[example]]
name = "layer_gpu_probe"
required-features = ["metal"]
[[example]]
name = "prefill_breakdown"
required-features = ["metal"]
[[example]]
name = "vision_chat"
required-features = ["metal"]
[[example]]
name = "vision_smoke"
required-features = ["metal"]
[[example]]
name = "dflash_probe"
required-features = ["metal"]
[[example]]
name = "dflash_probe2"
required-features = ["metal"]
# nan_probe imports rust_inference::metal directly. Without this gate a plain
# `cargo test` on a non-macOS host failed to COMPILE the example (E0432), so no
# integration test in this crate ran at all on Linux/CUDA hosts.
[[example]]
name = "nan_probe"
required-features = ["metal"]

# The Metal engine (our own MSL kernels + buffers) — behind the `metal`
# feature so a backend-less build (contract + CPU-test skeleton) compiles on
# any host.
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.31", optional = true }
objc = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
metal = "0.31"

[dev-dependencies]
half = "2"
# Packed-K-quant parity tests (tests/quant_kquants_parity.rs) reuse the
# speech crate's upload_quant + reference decoders (q5k_decode/q3k_decode)
# as the oracle for the CUDA packed upload/dequant path.
rust-inference-speech = { path = "../librust-inference-speech" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
